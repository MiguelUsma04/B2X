<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>B2K — Ingresar</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>◆</text></svg>">
<script>
  try {
    var t = localStorage.getItem('b2x-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  body{display:grid;place-items:center;min-height:100dvh;padding:24px}
  .login{width:100%;max-width:400px}
  .login .brand{font-size:40px;margin-bottom:2px}
  .login .tag{font-size:15px;color:var(--ink-3);margin-bottom:22px}
  .login .card{margin:0}
  .login input{margin-bottom:14px}
  .gbtn{width:100%;background:var(--surface);border-color:var(--line-strong);
        font-weight:600;gap:10px}
  .gbtn svg{width:18px;height:18px;flex:none}
  .sep{display:flex;align-items:center;gap:12px;margin:16px 0;
       color:var(--ink-3);font-size:12.5px}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
  <main class="login">
    <div class="brand">B2K<span>//</span></div>
    <p class="tag">Prospección B2B</p>
    <div class="card"><div class="body">

      <!--GOOGLE-->
      <a class="btn gbtn" href="/auth/google/start">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.400 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.4z"/>
          <path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4l-7.8-6.1C1 16.9 0 20.3 0 24s1 7.1 2.6 10.2l7.8-5.5z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.3 0-11.7-3.7-13.6-9.1l-7.8 5.5C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Ingresar con Google
      </a>
      <p class="help">Con tu cuenta de <b>{{DOMINIO}}</b>. Tu contraseña la
        manejás en Google: esta app nunca la ve.</p>
      <!--/GOOGLE-->

      <!--PASSWORD-->
      <div class="sep">o con la contraseña del equipo</div>
      <form method="post" action="/api/login">
        <label class="fld" for="pw">Contraseña</label>
        <input type="password" id="pw" name="password"
               autocomplete="current-password" required>
        <button class="primary block" type="submit">Ingresar</button>
      </form>
      <!--/PASSWORD-->

      <div id="msg"></div>
    </div></div>
  </main>
<script>
  var e = new URLSearchParams(location.search).get('error');
  if (e) {
    var texto = {
      '1': 'Contraseña incorrecta. Revisá el bloqueo de mayúsculas.',
      'cancelado': 'Se canceló el ingreso con Google.',
      'estado': 'El intento de ingreso venció o no coincidió. Probá de nuevo.',
      'token': 'Google devolvió una respuesta que no se pudo validar.',
      'nogoogle': 'El ingreso con Google no está configurado en el servidor.',
      'access_denied': 'Google no autorizó el ingreso con esa cuenta.',
    }[e] || e;
    document.getElementById('msg').innerHTML =
      '<div class="alert err" style="margin:16px 0 0"></div>';
    document.querySelector('#msg .alert').textContent = texto;
  }
</script>
</body>
</html>
