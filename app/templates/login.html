<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B2X — Ingresar</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>◆</text></svg>">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .login{width:100%;max-width:420px}
  .login .brand{font-size:44px;margin-bottom:2px}
  .login .tag{font-size:16px;color:var(--ink-2);margin-bottom:26px}
  .login input{width:100%;margin-bottom:14px}
  .login button{width:100%}
</style>
</head>
<body>
  <main class="login">
    <div class="brand">B2X<span>//</span></div>
    <p class="tag">Buscador de emails para prospección</p>
    <div class="card"><div class="body">
      <form method="post" action="/api/login">
        <label class="fld" for="pw">Contraseña</label>
        <input type="password" id="pw" name="password" autofocus
               autocomplete="current-password" required>
        <button class="primary" type="submit">Ingresar</button>
      </form>
      <div id="msg"></div>
    </div></div>
  </main>
<script>
  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('msg').innerHTML =
      '<div class="alert err" style="margin:16px 0 0">La contraseña no es correcta. ' +
      'Revisá que no tengas activado el bloqueo de mayúsculas.</div>';
  }
</script>
</body>
</html>
