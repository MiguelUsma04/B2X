# Nginx para B2X. Reemplazá b2x.gmarketing.co por tu subdominio.
# Copiar a /etc/nginx/sites-available/b2x y enlazar en sites-enabled.
#
# El bloque HTTPS lo agrega certbot solo (paso 7 de la guía).

server {
    listen 80;
    listen [::]:80;
    server_name b2x.gmarketing.co;

    # Los CSV de Apollo pueden ser grandes.
    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El enriquecimiento tarda: sin esto nginx corta con 504.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Que el progreso llegue en vivo, sin buffering.
        proxy_buffering off;
    }
}
